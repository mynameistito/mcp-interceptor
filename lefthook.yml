pre-commit:
  parallel: true
  jobs:
    - run: bunx ultracite fix
      glob:
        - "**/*.js"
        - "**/*.jsx"
        - "**/*.ts"
        - "**/*.tsx"
        - "**/*.json"
        - "**/*.jsonc"
        - "**/*.css"
      stage_fixed: true

    - run: bunx tsc --noEmit
      glob:
        - "**/*.ts"
        - "**/*.tsx"

    # cleanup runs on every commit intentionally to remove build artifacts
    - run: bun run scripts/cleanup.ts
